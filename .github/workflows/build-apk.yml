name: Build Lexis Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug signing keystore for Google Sign-In compatibility
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build installable Android APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK for easy phone installation
        run: cp app/build/outputs/apk/debug/app-debug.apk Lexis-Android.apk

      - name: Upload APK as downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lexis-Android-APK
          path: Lexis-Android.apk
          retention-days: 90

      - name: Publish direct APK download on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Lexis Android APK (Latest)
          body: |
            اضغط على ملف **Lexis-Android.apk** بالأسفل لتحميل التطبيق مباشرة على هاتفك الأندرويد وتثبيته.
          files: Lexis-Android.apk
          make_latest: true
